<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>#Embedded</title>
    <link rel="stylesheet" href="/static/css/style.css?v=8">
</head>
<body>
    <header class="header">
        <div class="header-left">
            <h1 class="logo-title">#Embedded</h1>
        </div>

        <div class="header-center">
            <div class="search-bar">
                <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="search" id="search-input" class="search-input"
                       placeholder="Поиск фото по описанию..." autocomplete="off"
                       aria-label="Поиск фото по описанию">
                <button type="button" id="search-clear" class="search-clear-btn"
                        title="Очистить поиск" aria-label="Очистить поиск" hidden>×</button>
            </div>
        </div>

        <div class="header-right">
            <div class="stats-panel">
                <span id="stats-text">Загрузка статистики...</span>
            </div>
        </div>
    </header>

    <div class="app-layout">
        <!-- Боковая панель инструментов слева -->
        <aside class="sidebar-toolbar" id="sidebar-toolbar" aria-label="Панель инструментов">
            <div class="toolbar-top">
                <button id="btn-analyze" class="toolbar-btn" type="button"
                        aria-label="Проанализировать фото" title="Проанализировать фото">
                    <!-- Пиктограмма линейного слоя нейросети -->
                    <svg class="toolbar-icon" width="24" height="24" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <line x1="5" y1="5" x2="19" y2="8" stroke-opacity="0.65"></line>
                        <line x1="5" y1="5" x2="19" y2="16" stroke-opacity="0.65"></line>
                        <line x1="5" y1="12" x2="19" y2="8" stroke-opacity="0.65"></line>
                        <line x1="5" y1="12" x2="19" y2="16" stroke-opacity="0.65"></line>
                        <line x1="5" y1="19" x2="19" y2="8" stroke-opacity="0.65"></line>
                        <line x1="5" y1="19" x2="19" y2="16" stroke-opacity="0.65"></line>
                        <circle cx="5" cy="5" r="2.5" fill="currentColor"></circle>
                        <circle cx="5" cy="12" r="2.5" fill="currentColor"></circle>
                        <circle cx="5" cy="19" r="2.5" fill="currentColor"></circle>
                        <circle cx="19" cy="8" r="2.5" fill="currentColor"></circle>
                        <circle cx="19" cy="16" r="2.5" fill="currentColor"></circle>
                    </svg>
                    <span class="toolbar-tooltip">Проанализировать фото</span>
                </button>
            </div>

            <div class="toolbar-bottom">
                <button id="btn-settings" class="toolbar-btn" type="button"
                        aria-label="Настройки" title="Настройки">
                    <!-- Пиктограмма настроек (шестеренка) -->
                    <svg class="toolbar-icon" width="24" height="24" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                    </svg>
                    <span class="toolbar-tooltip">Настройки</span>
                </button>
            </div>
        </aside>

        <!-- Основная область с содержимым альбома -->
        <main class="main-content">
            <div class="container">
                <!-- Навигационная цепочка (Breadcrumbs) -->
                <nav id="breadcrumbs" class="breadcrumbs"></nav>

                <!-- Список вложенных альбомов/папок -->
                <section id="folders-container" class="folders-grid"></section>

                <!-- Сетка фотографий -->
                <section id="photos-container" class="photos-grid"></section>

                <div id="empty-state" class="empty-state" style="display: none;">
                    В этой папке пока нет файлов или подпапок.
                </div>
            </div>
        </main>
    </div>

    <!-- Модальное окно настроек -->
    <div id="settings-modal" class="modal" hidden>
        <div class="modal-backdrop" data-modal-close></div>
        <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="settings-modal-title">
            <div class="modal-header">
                <h2 id="settings-modal-title">Настройки</h2>
                <button type="button" class="icon-btn modal-close-btn" data-modal-close title="Закрыть (Esc)" aria-label="Закрыть">×</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="settings-photos-dir" class="form-label">Папка с фотографиями:</label>
                    <input type="text" id="settings-photos-dir" class="form-input"
                           placeholder="Например, ./photos или C:\Users\Фото" autocomplete="off">
                    <div id="settings-db-info" class="form-hint">База данных: album.db</div>
                </div>
                <div id="settings-status" class="settings-status" role="status"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-modal-close>Закрыть</button>
                <button type="button" id="btn-modal-scan" class="btn btn-primary">Просканировать папку</button>
            </div>
        </div>
    </div>

    <!-- Полноразмерный просмотр фотографии -->
    <div id="lightbox" class="lightbox" hidden>
        <div class="lightbox-backdrop" data-lightbox-close></div>
        <div class="lightbox-dialog" role="dialog" aria-modal="true" aria-labelledby="lightbox-title">
            <div class="lightbox-toolbar">
                <div id="lightbox-title" class="lightbox-title"></div>
                <div class="lightbox-controls">
                    <button id="zoom-out" class="icon-btn" type="button" title="Уменьшить" aria-label="Уменьшить">−</button>
                    <span id="zoom-level" class="zoom-level">100%</span>
                    <button id="zoom-in" class="icon-btn" type="button" title="Увеличить" aria-label="Увеличить">+</button>
                    <button id="zoom-reset" class="btn btn-secondary" type="button">Сбросить</button>
                    <button id="lightbox-close" class="icon-btn" type="button" title="Закрыть (Esc)" aria-label="Закрыть">×</button>
                </div>
            </div>

            <div id="lightbox-viewport" class="lightbox-viewport">
                <img id="lightbox-image" class="lightbox-image" alt="" draggable="false">

                <button id="photo-prev" class="photo-nav photo-nav-prev" type="button"
                        title="Предыдущее фото (←)" aria-label="Предыдущее фото" hidden>‹</button>
                <button id="photo-next" class="photo-nav photo-nav-next" type="button"
                        title="Следующее фото (→)" aria-label="Следующее фото" hidden>›</button>

                <div id="lightbox-status" class="lightbox-status">Загрузка…</div>

                <button id="photo-fullscreen" class="photo-fullscreen-btn" type="button"
                        title="На весь экран" aria-label="Открыть фото на весь экран">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="2" stroke-linecap="round"
                         stroke-linejoin="round" aria-hidden="true">
                        <path d="M8 3H5a2 2 0 0 0-2 2v3"></path>
                        <path d="M21 8V5a2 2 0 0 0-2-2h-3"></path>
                        <path d="M3 16v3a2 2 0 0 0 2 2h3"></path>
                        <path d="M16 21h3a2 2 0 0 0 2-2v-3"></path>
                    </svg>
                </button>
            </div>

            <div class="lightbox-captions">
                <label class="caption-field">
                    <span class="caption-label">Ручное описание</span>
                    <textarea id="manual-caption" class="caption-input" rows="3" maxlength="5000"
                              placeholder="Введите описание…"></textarea>
                </label>
                <div class="caption-field">
                    <span class="caption-label">Автоматическое описание</span>
                    <div id="auto-caption" class="caption-readonly">—</div>
                </div>
                <div class="caption-footer">
                    <span id="caption-status" class="caption-status" role="status"></span>
                    <button id="save-caption" class="btn" type="button">Сохранить</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/app.js?v=8"></script>
</body>
</html>
